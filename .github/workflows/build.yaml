name: CI/CD

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            cdemmer04/student-app:latest
  
  scan:
    name: Scan
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Docker Scout CVEs
        uses: docker/scout-action@v1.24.0
        with:
          command: cves
          image: "cdemmer04/student-app:latest" # If image is not set (or empty) the most recently built image, if any, will be used instead.
          only-fixed: false
          only-severities: critical, high
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }} # to be able to write the comment
          exit-code: false

  # test:
  #   name: Test
  #   needs: [ scan ]
  #   runs-on: ubuntu-latest
  #   steps:
  #     # - name: Checkout the repository
  #     #   uses: actions/checkout@v7

  #     - name: Login to Docker Hub
  #       uses: docker/login-action@v2
  #       with:
  #         username: ${{ secrets.DOCKERHUB_LOGIN }}
  #         password: ${{ secrets.DOCKER_HUB_PASSWORD }}

  #     - name: test 
  #       run: |
  #         docker run -d -p 80:5000 cdemmer04/student-app:latest
  #         sleep 10s
  #         curl http://localhost
  #         docker ps -aq | xargs docker stop | xargs docker rm

  test:
    name: Test
    needs: [ scan ]
    runs-on: ubuntu-latest
    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Run docker container for postman tests
        run: |
          docker run -d -p 80:5000 cdemmer04/student-app:latest
          sleep 10s
          curl http://localhost

      - uses: postmanlabs/postman-cli-action@v1
        with:
          command: 'collection run 53462478-91eaa02d-6ede-435c-89df-67c364eb8802'
          api-key: ${{ secrets.POSTMAN_API_KEY }}

  deploy:
    name: Deploy
    needs: [ test ]
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - run: |
              sudo kubectl delete deployment --all              
              sudo kubectl apply -f ${{ github.workspace }}/kubernetes/deployment.yaml --force
              sudo kubectl apply -f ${{ github.workspace }}/kubernetes/nginx-service.yaml --force
