apiVersion: v1
kind: ServiceAccount
metadata:
  name: student-app-serviceaccount
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pods-only-viewer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-cluster-role-binding
subjects:
- namespace: default
  kind: ServiceAccount
  name: student-app-serviceaccount
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pods-only-viewer
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: student-app-serviceaccount-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: student-app-serviceaccount